user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    
    # Basic Settings
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Fix $connection_upgrade variable for WebSocket
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # Only include our nakama configs, skip root-owned conf.d/*
    include /home/ubuntu/projects/nakama/infra/nginx-nakama.conf;
    include /home/ubuntu/projects/nakama/infra/nginx-nakama-ssl.conf;
}