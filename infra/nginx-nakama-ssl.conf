# Nakama HTTPS origin (for Cloudflare Full Strict)
# Cloudflare -> :443 (TLS) -> nginx -> 127.0.0.1:8000 (Docker API)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mynakama.web.id www.mynakama.web.id api.mynakama.web.id;

    ssl_certificate     /etc/nginx/ssl/mynakama-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/mynakama-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}