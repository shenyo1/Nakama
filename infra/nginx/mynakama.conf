# ── Main domain: Nakama frontend (Next.js) ──
# Serves the live Next.js app on :3000 (movies/manga/manhwa/novel content).
# TLS terminates at the Cloudflare edge; this origin is plaintext :80.
server {
    listen 80;
    server_name mynakama.web.id www.mynakama.web.id;

    # Security response headers (see snippets/nakama-security-headers.conf).
    include snippets/nakama-security-headers.conf;

    # All content routes -> Next.js app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Keep /health pointed at the API for uptime monitors.
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}

# ── API subdomain ──
server {
    listen 80;
    server_name api.mynakama.web.id;

    # Security response headers (see snippets/nakama-security-headers.conf).
    include snippets/nakama-security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
