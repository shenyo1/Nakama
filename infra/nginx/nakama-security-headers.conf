# Nakama security response headers (origin behind Cloudflare, plaintext :80).
# HSTS is intentionally NOT set here — TLS terminates at the Cloudflare edge,
# so HSTS belongs at CF (setting it on the plaintext origin hop is wrong).
# 'always' ensures headers are sent even on error responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
