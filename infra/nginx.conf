# ⚔️ Nakama Nginx Reverse Proxy
# Cloudflare handles SSL termination (Flexible SSL mode).
# Nginx sits behind Cloudflare, reverse-proxying to the API container.

server {
    listen 80;
    server_name api.mynakama.web.id api.mynakama.web.id mynakama.web.id;

    # ── Real IP from Cloudflare ──────────────────────────
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── API Backend Proxy ────────────────────────────────
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        # WebSocket support (MCP server)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Health check passthrough ──────────────────────────
    location /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Static / large files ──────────────────────────────
    client_max_body_size 100m;
    client_body_timeout 120s;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}