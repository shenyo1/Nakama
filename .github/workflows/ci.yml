name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:  # allow manual deploy trigger

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev 2>/dev/null || true

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Verify critical imports work before running tests
          python -c "import fastapi; import strawberry; print('core deps OK')"

      - name: Verify imports (quick check)
        env:
          OFFLINE_MODE: "1"
          PYTHONPATH: .
          DATABASE_URL: "sqlite+aiosqlite:////tmp/nakama-ci-test.sqlite"
        run: |
          source .venv/bin/activate
          python -c "
          import os, sys
          os.environ['OFFLINE_MODE'] = '1'
          os.environ['DATABASE_URL'] = 'sqlite+aiosqlite:////tmp/nakama-ci-test.sqlite'
          os.environ['JWT_SECRET'] = 'test-secret-ci-please-change-32b'
          os.environ.pop('API_KEY', None)
          from app.main import app
          print(f'App v{app.version} loaded OK')
          print(f'Routes: {len(app.routes)}')
          "

      - name: Run pytest (OFFLINE_MODE=1)
        env:
          OFFLINE_MODE: "1"
          PYTHONPATH: .
          FIXTURES_DIR: fixtures
          DATABASE_URL: "sqlite+aiosqlite:////tmp/nakama-ci-test.sqlite"
          JWT_SECRET: "test-secret-ci-please-change-32b"
        timeout-minutes: 8
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --timeout=30 -x --no-header 2>&1 | tail -40

  deploy:
    name: deploy VPS
    needs: [test]
    runs-on: ubuntu-latest
    # Deploy on push to main, or manual trigger.
    # Requires NAKAMA_VPS_HOST, NAKAMA_VPS_USER, NAKAMA_VPS_SSH_KEY, NAKAMA_VPS_PORT secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAKAMA_VPS_HOST }}
          username: ${{ secrets.NAKAMA_VPS_USER }}
          key: ${{ secrets.NAKAMA_VPS_SSH_KEY }}
          port: ${{ secrets.NAKAMA_VPS_PORT }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /home/ubuntu/projects/nakama
            git remote -v
            GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/nakama_deploy -o IdentitiesOnly=yes' git fetch origin main
            GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/nakama_deploy -o IdentitiesOnly=yes' git reset --hard origin/main
            /home/ubuntu/projects/nakama/backend/deploy/restart.sh
            # smoke
            curl -fsS -H 'Host: mynakama.web.id' http://127.0.0.1/health | head -c 200
            echo
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: mynakama.web.id' http://127.0.0.1/anime/otakudesu/home || true)
            test "$code" = "401"
            echo "smoke ok (health 200, protected 401)"
